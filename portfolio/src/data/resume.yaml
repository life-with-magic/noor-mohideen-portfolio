projects:
  - id: "decision-agent"
    num: "01"
    badge: "AI REASONING APPLICATION"
    accentColor: "#06b6d4"
    browserUrl: "decision-agent.edinburgh.ai"
    title: "Decision & Comparison Conversational Agent"
    tagline: "Dual-Mode Reasoning Engine with Factual Grounding"
    organization: "University of Edinburgh"
    location: "Edinburgh, UK"
    period: "Sep 2026 — Present"
    tech: ["Python", "LLM Orchestration", "RAG", "Multi-Criteria Decision Analysis", "Evidence Frameworks"]
    githubUrl: "https://github.com/life-with-magic"
    about: >
      Architected a dual-mode conversational reasoning agent capable of navigating complex user decisions.
      The system proactively queries users to resolve underspecified constraints, supporting both Decision Mode
      (multi-criteria trade-off evaluation) and Comparison Mode (side-by-side alternative analysis).
      
      A core technical breakthrough is the transparent reasoning framework that strictly delineates verifiable
      facts (source-backed) from operational assumptions and user-defined priorities to deliver auditable,
      explainable recommendations.
      
      Implemented an adaptive dual-speed routing engine that dynamically toggles between a low-latency Faster Mode
      and a Deep-Thinking Mode equipped with scenario analysis, source freshness validation, and conflict detection.

  - id: "coding-pipeline"
    num: "02"
    badge: "AGENTIC SYNTHESIS PIPELINE"
    accentColor: "#8b5cf6"
    browserUrl: "agent-pipeline.zeb.ai"
    title: "Multi-Source Agentic Coding Pipeline"
    tagline: "Autonomous Context Synthesis into First-Cut Codebases"
    organization: "Zeb AI"
    location: "Chennai, India"
    period: "Feb 2026 — Sep 2026"
    tech: ["Python", "Agentic AI", "AWS Architecture", "Cloud-Native", "Isolated Sandboxes", "LLM Orchestration"]
    githubUrl: "https://github.com/life-with-magic"
    about: >
      Engineered an autonomous context-aggregation and code-generation pipeline that dynamically ingests disparate
      inputs across enterprise tools—synthesizing Jira stories, GitHub repositories, OneDrive PRDs, and client email
      specifications into a unified query context.
      
      Engineered autonomous code-generation workflows to synthesize multi-source requirements into high-quality
      first-cut codebases, enabling rapid human-in-the-loop review and shifting developer focus toward high-level problem-solving.
      
      Designed a flexible plug-and-play adapter layer supporting both pre-configured and dynamic, on-the-fly data source
      onboarding accessible across desktop and mobile clients. Built the underlying orchestration engine with cross-domain
      extensibility into QA testing, cloud infrastructure, and sales automation.

  - id: "mcp-warehousing"
    num: "03"
    badge: "ENTERPRISE MCP FRAMEWORK"
    accentColor: "#10b981"
    browserUrl: "mcp-platform.avasoft.com"
    title: "Multi-Agent Orchestration for Data Warehousing"
    tagline: "Enterprise MCP Servers Interfacing Snowflake & Databricks"
    organization: "Avasoft"
    location: "Chennai, India"
    period: "Jun 2025 — Jan 2026"
    tech: ["Python", "Multi-Agent Systems", "Model Context Protocol (MCP)", "BYO-LLM", "Microservices", "REST APIs"]
    githubUrl: "https://github.com/life-with-magic"
    about: >
      Architected a multi-agent orchestration framework utilizing custom Model Context Protocol (MCP) servers to
      interface autonomous agents with enterprise data warehouses, including Snowflake and Databricks.
      
      Engineered a modular ecosystem of 20+ internal Python libraries powering inter-agent workflows, authoring 7 core
      libraries from scratch and co-developing the shared tool suite.
      
      Designed a provider-agnostic 'Bring Your Own LLM' (BYOLLM) abstraction supporting 10+ LLM providers, embedding dynamic
      analytics dashboards seamlessly into the client’s SaaS platform. Scaled into production serving active users
      across 200+ distinct enterprise organizations.

